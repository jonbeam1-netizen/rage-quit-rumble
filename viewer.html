<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RQR Character Viewer</title>
<style>
  :root { --bg:#14161a; --panel:#1d2027; --panel2:#262a33; --text:#e6e8ec; --muted:#8b93a3; --accent:#ff6a3d; --line:#333845; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text); font:14px/1.4 system-ui, Segoe UI, sans-serif; overflow:hidden; }
  #app { display:grid; grid-template-columns: 220px 1fr 240px; height:100%; }
  aside { background:var(--panel); overflow:auto; padding:12px; border-right:1px solid var(--line); }
  aside.right { border-right:0; border-left:1px solid var(--line); }
  h1 { font-size:15px; margin:0 0 10px; letter-spacing:.3px; }
  h1 span { color:var(--accent); }
  h2 { font-size:11px; text-transform:uppercase; letter-spacing:.8px; color:var(--muted); margin:14px 0 6px; }
  button { display:block; width:100%; text-align:left; background:var(--panel2); color:var(--text); border:1px solid transparent; border-radius:6px; padding:6px 9px; margin:3px 0; cursor:pointer; font:inherit; }
  button:hover { border-color:var(--line); }
  button.active { background:var(--accent); color:#111; font-weight:600; }
  label.row { display:flex; align-items:center; gap:8px; margin:4px 0; color:var(--text); }
  label.row input[type=color] { width:28px; height:22px; border:0; padding:0; background:none; cursor:pointer; }
  input[type=range] { width:100%; }
  #stage { position:relative; min-width:0; }
  canvas { display:block; }
  #hud { position:absolute; left:12px; bottom:10px; color:var(--muted); font-size:12px; pointer-events:none; }
  #hud b { color:var(--text); }
  #status { position:absolute; top:10px; left:50%; transform:translateX(-50%); background:#0009; padding:4px 10px; border-radius:6px; font-size:12px; color:var(--muted); }
  .muted { color:var(--muted); font-size:12px; }
  @media (max-width: 800px) { #app { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; } aside { max-height:30vh; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
  "./src/characters.js": "./src/characters.js?v=202611081357",
  "./src/profile.js": "./src/profile.js?v=202611081357",
  "./src/picker.js": "./src/picker.js?v=202611081357",
  "./src/viewer.js": "./src/viewer.js?v=202611081357"
} }
</script>
</head>
<body>
<div id="app">
  <aside>
    <h1>Rage Quit <span>Rumble</span></h1>
    <div class="muted">Character viewer</div>
    <h2>Men</h2><div id="men"></div>
    <h2>Women</h2><div id="women"></div>
  </aside>
  <div id="stage">
    <div id="status">Loading...</div>
    <div id="hud"></div>
  </div>
  <aside class="right">
    <h2>Playback</h2>
    <label class="row">Speed <input id="speed" type="range" min="0" max="2" step="0.05" value="1"><span id="speedv">1.0</span></label>
    <label class="row"><input id="loop" type="checkbox" checked> Loop</label>
    <label class="row"><input id="rotate" type="checkbox" checked> Auto-rotate</label>
    <h2>Animations <span id="animcount" class="muted"></span></h2>
    <div id="anims"></div>
    <h2>Parts</h2>
    <div id="parts"></div>
    <h2>Colors</h2>
    <div id="colors"></div>
  </aside>
</div>
<script type="module" src="src/viewer.js?v=202611081357"></script>
</body>
</html>
