<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rage Quit Rumble</title>
<style>
  :root { --bg:#14161a; --panel:#1d2027; --panel2:#262a33; --text:#e6e8ec; --muted:#8b93a3; --accent:#ff6a3d; --line:#333845; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text); font:14px/1.4 system-ui, Segoe UI, sans-serif; overflow:hidden; }
  #app { display:grid; grid-template-columns: 1fr 440px; grid-template-rows: 100%; height:100%; }
  #stage { position:relative; min-width:0; }
  #stage canvas { display:block; }
  #stage.loading::after { content:'Loading…'; position:absolute; top:12px; left:50%; transform:translateX(-50%); background:#0009; color:var(--muted); padding:4px 10px; border-radius:6px; font-size:12px; }
  #brand { position:absolute; top:14px; left:16px; font-size:22px; font-weight:800; letter-spacing:.3px; pointer-events:none; }
  #brand span { color:var(--accent); }
  #tools { position:absolute; bottom:10px; left:16px; font-size:12px; }
  #tools a { color:var(--muted); text-decoration:none; }
  #tools a:hover { color:var(--text); }
  aside { background:var(--panel); border-left:1px solid var(--line); overflow:auto; padding:16px; display:flex; flex-direction:column; gap:14px; }
  h2 { font-size:11px; text-transform:uppercase; letter-spacing:.8px; color:var(--muted); margin:0 0 6px; }
  .field { display:flex; gap:8px; align-items:center; }
  input[type=text] { flex:1; background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:9px 11px; font:inherit; font-size:15px; outline:none; }
  input[type=text]:focus { border-color:var(--accent); }
  button { font:inherit; cursor:pointer; }
  .ghost { background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:9px 12px; }
  .ghost:hover { border-color:var(--muted); }
  #colors { display:flex; gap:8px; flex-wrap:wrap; }
  .swatch { width:30px; height:30px; border-radius:50%; border:3px solid transparent; outline:2px solid transparent; padding:0; }
  .swatch.selected { border-color:var(--bg); outline-color:#fff; }
  #tints { display:grid; grid-template-columns: 1fr 1fr; gap:4px 10px; }
  .tint { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--text); }
  .tint input[type=color] { width:30px; height:24px; border:1px solid var(--line); border-radius:6px; padding:1px; background:var(--panel2); cursor:pointer; }
  .ghost:disabled { opacity:.4; cursor:default; }
  .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap:8px; }
  .card { position:relative; display:flex; flex-direction:column; align-items:center; gap:4px; background:var(--panel2); border:2px solid transparent; border-radius:10px; padding:6px 4px 6px; color:var(--text); }
  .card img { width:64px; height:64px; border-radius:8px; background:linear-gradient(#2a2e38,#171a21); display:block; }
  .card span { font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
  .card:hover { border-color:var(--line); }
  .card.selected { border-color:var(--accent); }
  .card.selected span { color:var(--text); }
  .card.locked { opacity:.45; cursor:default; }
  .card.locked .lock { width:64px; height:64px; border-radius:8px; background:#171a21; display:grid; place-items:center; font-size:24px; }
  #footer { margin-top:auto; display:flex; flex-direction:column; gap:8px; position:sticky; bottom:-16px; background:var(--panel); padding:10px 0 16px; border-top:1px solid var(--line); }
  #save { background:var(--accent); color:#111; font-weight:700; border:0; border-radius:10px; padding:13px; font-size:16px; }
  #save:disabled { background:#3a3f4b; color:var(--muted); cursor:default; }
  #saved { font-size:12px; color:var(--muted); min-height:16px; }
  #play { display:flex; gap:8px; align-items:stretch; }
  #play .go { flex:1; background:#3dd6ff; color:#06202a; font-weight:700; border:0; border-radius:10px; padding:12px; font-size:15px; }
  #play .go.alt { background:var(--panel2); color:var(--text); border:1px solid var(--line); flex:none; padding:12px 16px; }
  .joinrow { flex:1; display:flex; gap:6px; }
  .joinrow input { width:84px; text-transform:uppercase; letter-spacing:3px; text-align:center; font-weight:700; }
  @media (max-width: 860px) { #app { grid-template-columns:1fr; grid-template-rows: 45% 55%; } aside { border-left:0; border-top:1px solid var(--line); } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
  "./src/characters.js": "./src/characters.js?v=202611081438",
  "./src/profile.js": "./src/profile.js?v=202611081438",
  "./src/picker.js": "./src/picker.js?v=202611081438",
  "./src/viewer.js": "./src/viewer.js?v=202611081438"
} }
</script>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="brand">Rage Quit <span>Rumble</span></div>
    <div id="tools"><a href="viewer.html">character viewer</a></div>
  </div>
  <aside>
    <div>
      <h2>Name</h2>
      <div class="field"><input id="name" type="text" autocomplete="off" spellcheck="false" placeholder="Your name"></div>
    </div>
    <div>
      <h2>Team color</h2>
      <div id="colors"></div>
    </div>
    <div>
      <div style="display:flex; justify-content:space-between; align-items:baseline;"><h2>Character colors</h2><button id="tintreset" class="ghost" style="padding:4px 10px; font-size:12px;">Reset</button></div>
      <div id="tints"></div>
    </div>
    <div>
      <div style="display:flex; justify-content:space-between; align-items:baseline;"><h2>Men</h2><button id="random" class="ghost" style="padding:4px 10px; font-size:12px;">Random</button></div>
      <div id="men" class="grid"></div>
    </div>
    <div>
      <h2>Women</h2>
      <div id="women" class="grid"></div>
    </div>
    <div>
      <h2>Locked</h2>
      <div id="locked" class="grid"></div>
    </div>
    <div id="footer">
      <button id="save">Save</button>
      <div id="saved"></div>
      <div id="play">
        <button id="host" class="go">Host a room</button>
        <div class="joinrow"><input id="joincode" type="text" maxlength="4" placeholder="CODE" autocomplete="off" spellcheck="false"><button id="join" class="go alt">Join</button></div>
      </div>
    </div>
  </aside>
</div>
<script type="module" src="src/picker.js?v=202611081438"></script>
</body>
</html>
